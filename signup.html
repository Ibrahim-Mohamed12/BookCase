<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - BookCase</title>
    <link rel="stylesheet" href="assets/CSS/auth.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div class="Container">
        <div class="mainSection">
            <div class="navbar">
                <div class="NavElements">
                    <a id="Logo" href="homePage.html"><img src="assets/IMG/Logo.png"></a>
                    <section class="NavPages">
                        <a id="NavLink1" href="homePage.html">Home</a>
                        <a id="NavLink2" href="categories.html">Categories</a>
                        <a id="NavLink3" href="favourite.html">Favourite</a>
                        <a id="NavLink4" href="about.html">About Us</a>
                    </section>
                    <section class="Register">
                        <a href="login.html" id="Login">Log in</a>
                        <a href="signup.html" id="Signup" class="active">Signup</a>
                    </section>
                    <p id="DropButton"><span class="material-symbols-outlined">menu</span></p>
                    <section class="DropList">
                        <img src="assets/IMG/Logo.png">
                        <ul id="List">
                            <li class="options"><span class="material-symbols-outlined">home</span><a href="homePage.html">Home</a></li>
                            <li class="options"><span class="material-symbols-outlined">category</span><a href="categories.html">Categories</a></li>
                            <li class="options"><span class="material-symbols-outlined">favorite</span><a href="favourite.html">Favorite</a></li>
                            <li class="options"><span class="material-symbols-outlined">info</span><a href="about.html">About Us</a></li>
                            <li class="options"><span class="material-symbols-outlined">login</span><a href="login.html">Login</a></li>
                            <li class="options"><span class="material-symbols-outlined">add</span><a href="signup.html">Signup</a></li>
                        </ul>
                    </section>
                </div>
            </div>
            
            <div class="authContainer">
                <div class="authBox">
                    <h1>Create Account</h1>
                    <p class="subtitle">Join us to explore thousands of books</p>
                    
                    <form id="signupForm">
                        <div class="inputGroup">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Create a password" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                        
                        <div class="termsCheck">
                            <label class="checkbox">
                                <input type="checkbox" id="terms" required>
                                <span>I agree to the <a href="#">Terms & Conditions</a></span>
                            </label>
                        </div>
                        
                        <button type="submit" class="authButton">Sign Up</button>
                        
                        <p class="switchAuth">
                            Already have an account? <a href="login.html">Login here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/JAVASCRIPT/auth.js"></script>
</body>
</html>
