<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - BookCase</title>
    <link rel="stylesheet" href="assets/CSS/auth.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div class="Container">
        <div class="mainSection">
            <div class="navbar">
                <div class="NavElements">
                    <a id="Logo" href="index.html"><img src="assets/IMG/Logo.png"></a>
                    
                    <!-- Add user profile section when logged in -->
                    <section class="UserProfile" style="display: none;">
                        <span class="material-symbols-outlined" id="userIcon">account_circle</span>
                        <span id="username"></span>
                        <button id="logoutBtn">Logout</button>
                    </section>        
                    <section class="Register">
                        <a href="login.html" id="Login">Log in</a>
                        <a href="signup.html" id="Signup">Signup</a>
                    </section>
                </div>
            </div>
            <div class="authContainer">
                <div class="authBox">
                    <h1>Create Account</h1>
                    <p class="subtitle">Join us to explore thousands of books</p>
                    
                    <form id="signupForm">
                        <div class="inputGroup">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Create a password" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        </div>
                        
                        <div class="termsCheck">
                            <label class="checkbox">
                                <input type="checkbox" id="terms" required>
                                <span>I agree to the <a href="#">Terms & Conditions</a></span>
                            </label>
                        </div>
                        
                        <button type="submit" class="authButton">Sign Up</button>
                        
                        <p class="switchAuth">
                            Already have an account? <a href="login.html">Login here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/JAVASCRIPT/auth.js"></script>
</body>
</html>
