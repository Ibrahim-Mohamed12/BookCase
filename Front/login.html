<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookCase</title>
    <link rel="stylesheet" href="assets/CSS/auth.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
    <div class="Container">
        <div class="mainSection">
            <div class="navbar">
                <div class="NavElements">
                    <a id="Logo" href="index.html"><img src="assets/IMG/Logo.png"></a>
                    
                    <!-- Add user profile section when logged in -->
                    <section class="UserProfile" style="display: none;">
                        <span class="material-symbols-outlined" id="userIcon">account_circle</span>
                        <span id="username"></span>
                        <button id="logoutBtn">Logout</button>
                    </section>        
                    <section class="Register">
                        <a href="login.html" id="Login">Log in</a>
                        <a href="signup.html" id="Signup">Signup</a>
                    </section>
                </div>
            </div>
            
            <div class="authContainer">
                <div class="authBox">
                    <h1>Welcome Back</h1>
                    <p class="subtitle">Login to access your favorite books</p>
                    
                    <form id="loginForm">
                        <div class="inputGroup">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Enter your email" required>
                        </div>
                        
                        <div class="inputGroup">
                            <label for="password">Password</label>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </div>
                        
                        <div class="rememberForgot">
                            <label class="checkbox">
                                <input type="checkbox" id="remember">
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgotPassword">Forgot Password?</a>
                        </div>
                        
                        <p id="loginError" class="errorMessage" style="display: none;">
                        Invalid email or password
                        </p>

                        <button type="submit" class="authButton">Login</button>
                        
                        <p class="switchAuth">
                            Don't have an account? <a href="signup.html">Sign up here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
        

    <script src="assets/JAVASCRIPT/auth.js"></script>
</body>
</html>
